version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep Node types on the runtime baseline major (.node-version).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors are a toolchain decision (deferred until the Bun
      # toolchain migration; see docs/roadmap.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # Harness deps mirror upstream pi's exactly tested set: security updates only,
  # no routine version-bump PRs (upgrades happen deliberately; see AGENTS.md).
  - package-ecosystem: npm
    directory: /packages/harness
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

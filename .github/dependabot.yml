version: 2
updates:
  # The root entry covers workspace manifests (packages/harness) too.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Majors are deliberate decisions everywhere (toolchain, runtime baseline,
      # harness dep drift from upstream); see AGENTS.md and docs/roadmap.md.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Upstream pi packages upgrade in lockstep with a harness reverification,
      # never automatically (ADR 0003).
      - dependency-name: "@earendil-works/*"
      # typebox types flow through the pi-* public APIs; its version must match
      # the pinned pi packages' copy or the build gets two incompatible instances.
      - dependency-name: typebox
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

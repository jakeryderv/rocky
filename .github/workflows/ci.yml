name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Install system search tools
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends fd-find ripgrep

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format and lint
        run: npm run check

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test root suite with coverage
        run: npm run test:coverage

      - name: Test harness suite
        run: npm test --workspace @jakeryderv/rocky-harness

      - name: Offline smoke checks
        run: npm run smoke:built

      - name: Client typecheck
        run: npm run client:typecheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            coverage/
            reports/
          if-no-files-found: ignore
          retention-days: 5

  # The client renders only under Bun: OpenTUI's native FFI has no Node backend
  # on our baseline. Kept a separate job so the Node gate stays Node-only.
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Client typecheck
        run: npm run client:typecheck

      - name: Client tests (bun)
        run: npm run client:test

      - name: Client smoke (bun)
        run: npm run client:smoke
